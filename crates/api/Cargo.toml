[package]
name = "api"
edition = "2024"
publish = false

[features]
sqll = ["dep:sqll", "js", "koine/sqll014"]
js = ["jiff/js"]
rand = ["dep:rand"]
yew = ["dep:yew", "dep:implicit-clone", "koine/yew023"]

[dependencies]
auth = { package = "watchword", version = "0.1", features = ["musli01"] }
koine = { version = "0.1", features = ["musli01", "serde"] }

base64 = "0.22.1"
jiff = "0.2.37"
musli-core = { version = "0.1.7", default-features = false, features = ["alloc", "std"] }
musli-web = { version = "0.4.10", features = ["api"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = { version = "0.10.3", optional = true }
sqll = { version = "0.14.7", optional = true }
yew = { version = "0.23.0", optional = true }
implicit-clone = { version = "0.6.0", optional = true }

